[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "steward"
version = "0.4.0"
description = "A small persistent owner agent for one domain, with a durable inbox, a wake gate, folded memory, journaled writes and signed outcomes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["llm", "agents", "persistent-agent", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]

[project.scripts]
steward = "steward.cli:main"

[dependency-groups]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/onblueroses/simple-autonomous-agent"
Repository = "https://github.com/onblueroses/simple-autonomous-agent"
Issues = "https://github.com/onblueroses/simple-autonomous-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: contract tests against a real service; skipped without credentials"]
